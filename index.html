<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊覧飛行 — Island Flyover</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ローディング画面 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-title">🏝️ 遊覧飛行</div>
    <div class="loading-text">島を生成中...</div>
    <div class="loading-bar-outer">
      <div id="loading-bar" class="loading-bar-inner"></div>
    </div>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen" style="display:none">
    <div class="title-card">
      <div class="game-logo">🏝️ 遊覧飛行</div>
      <div class="game-sub">ISLAND FLYOVER</div>
      <p class="game-desc">
        南の島の上空をセスナで優雅に飛び回ろう。<br>
        美しい海、白い砂浜、緑豊かな山、秘密の洞窟。<br>
        のんびり自由気ままな空の旅へ。
      </p>
      <div class="controls-guide">
        <div class="ctrl-row"><kbd>W</kbd> / <kbd>↑</kbd> <span>機首下げ（降下）</span></div>
        <div class="ctrl-row"><kbd>S</kbd> / <kbd>↓</kbd> <span>機首上げ（上昇）</span></div>
        <div class="ctrl-row"><kbd>A</kbd> / <kbd>←</kbd> <span>左旋回</span></div>
        <div class="ctrl-row"><kbd>D</kbd> / <kbd>→</kbd> <span>右旋回</span></div>
        <div class="ctrl-row"><kbd>Shift</kbd> <span>加速</span></div>
        <div class="ctrl-row"><kbd>Ctrl</kbd> <span>減速</span></div>
        <div class="ctrl-row"><kbd>C</kbd> <span>カメラ視点切替</span></div>
        <div class="ctrl-row"><kbd>M</kbd> <span>ミニマップ切替</span></div>
        <div class="ctrl-row"><kbd>P</kbd> <span>一時停止</span></div>
      </div>
      <button id="btn-start" class="btn-primary">✈️ フライト開始</button>
    </div>
  </div>

  <!-- ゲームコンテナ -->
  <div id="game-container"></div>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <!-- ミニマップ -->
    <div id="minimap-container">
      <canvas id="minimap-canvas" width="160" height="160"></canvas>
      <div id="minimap-compass">N</div>
      <div id="minimap-zoom-label">1.0x</div>
    </div>

    <!-- インストルメント（計器） -->
    <div class="instruments">
      <div class="inst-panel">
        <div class="inst-label">SPEED</div>
        <div class="inst-val" id="val-speed">0</div>
        <div class="inst-unit">km/h</div>
      </div>
      <div class="inst-panel">
        <div class="inst-label">ALTITUDE</div>
        <div class="inst-val" id="val-alt">0</div>
        <div class="inst-unit">m</div>
      </div>
      <div class="inst-panel">
        <div class="inst-label">THROTTLE</div>
        <div class="inst-bar-wrap">
          <div class="inst-bar" id="bar-throttle" style="height:50%"></div>
        </div>
        <div class="inst-unit" id="val-throttle">50%</div>
      </div>
    </div>

    <!-- カメラ視点インジケータ -->
    <div id="camera-mode-badge">CHASE VIEW</div>

    <!-- ポーズボタン -->
    <button id="btn-pause" class="btn-icon">⏸️</button>
  </div>

  <!-- ポーズオーバーレイ -->
  <div id="pause-screen" style="display:none">
    <div class="pause-card">
      <div class="pause-title">PAUSED</div>
      <button id="btn-resume" class="btn-primary">再開</button>
      <button id="btn-restart" class="btn-secondary">最初から</button>
    </div>
  </div>

  <!-- 坠落・リスポーン画面 -->
  <div id="crash-screen" style="display:none">
    <div class="crash-card">
      <div class="crash-title">🌊 着水！</div>
      <p>安全な高度に戻ります...</p>
    </div>
  </div>

  <script src="game.bundle.js"></script>
</body>
</html>
