<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊覧飛行 — Island Flyover</title>
    <meta name="description" content="リゾート島を飛行機で自由に遊覧する3Dフライトゲーム。現在地がひと目でわかるミニマップレーダー機能付き。">
    <meta property="og:title" content="遊覧飛行 — Island Flyover">
    <meta property="og:description" content="リゾート島を飛行機で自由に遊覧する3Dフライトゲーム。現在地がひと目でわかるミニマップレーダー機能付き。">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ═══════════ ローディング画面 ═══════════ -->
<div id="loading">
    <div class="loading-content">
        <h1>🏝️ 遊覧飛行</h1>
        <p>島を生成中…</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>
</div>

<!-- ═══════════ スタート画面 ═══════════ -->
<div id="start-screen" style="display:none">
    <div class="start-content">
        <h1>🏝️ 遊覧飛行</h1>
        <h2>Island Flyover</h2>
        <button id="start-btn">✈️ フライト開始</button>
    </div>
</div>

<!-- ═══════════ ゲームコンテナ ═══════════ -->
<div id="game-container"></div>

<!-- ═══════════ HUD ═══════════ -->
<div id="hud" style="display:none">
    <!-- 速度 & 高度 -->
    <div id="hud-left" class="hud-glass">
        <div class="hud-row">
            <span class="hud-label">速度</span>
            <span class="hud-val"><span id="val-speed">0</span><span class="hud-unit"> km/h</span></span>
        </div>
        <div class="hud-row">
            <span class="hud-label">高度</span>
            <span class="hud-val"><span id="val-alt">0</span><span class="hud-unit"> m</span></span>
        </div>
    </div>

    <!-- コンパス -->
    <div id="hud-top" class="hud-glass">
        <span id="val-heading">000° N</span>
    </div>

    <!-- 一時停止ボタン -->
    <button id="pause-btn" class="hud-glass hud-btn" title="一時停止 (P / Esc)" aria-label="一時停止">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
        </svg>
    </button>

    <!-- ═══════════ ミニマップ (GPS レーダー) ═══════════ -->
    <div id="minimap-container" class="hud-glass" title="クリックまたは [M] キーで全体/追従切替">
        <canvas id="minimap-canvas"></canvas>
        <div id="minimap-mode-badge" class="minimap-badge">全体 (ALL)</div>
    </div>

    <!-- 速度バー -->
    <div id="speed-bar-container">
        <div id="speed-bar" style="height:33%"></div>
    </div>

    <!-- 操作ヘルプ -->
    <div id="help-panel" class="hud-glass">
        <div class="help-grid">
            <span class="key">W / ↑</span><span class="desc">降下</span>
            <span class="key">S / ↓</span><span class="desc">上昇</span>
            <span class="key">A / ←</span><span class="desc">左ロール</span>
            <span class="key">D / →</span><span class="desc">右ロール</span>
            <span class="key">Q / E</span><span class="desc">左右ヨー</span>
            <span class="key">Shift</span><span class="desc">加速</span>
            <span class="key">Ctrl</span><span class="desc">減速</span>
            <span class="key">M</span><span class="desc">マップ切替</span>
            <span class="key">P / Esc</span><span class="desc">一時停止</span>
            <span class="key">H</span><span class="desc">ヘルプ表示</span>
        </div>
    </div>
</div>

<!-- ═══════════ 一時停止画面 ═══════════ -->
<div id="pause-screen" style="display:none">
    <div class="pause-content">
        <h2>⏸️ 一時停止</h2>
        <p class="pause-subtitle">PAUSED</p>
        <div class="pause-btn-group">
            <button id="resume-btn" class="menu-btn primary-btn">▶️ 再開</button>
            <button id="home-btn" class="menu-btn secondary-btn">🏠 ホームへ戻る</button>
        </div>
    </div>
</div>

<!-- ═══════════ メインスクリプト ═══════════ -->
<script type="module" src="/js/main.js"></script>
</body>
</html>
